<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Omassery Open World — Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ac7d8;font-family:system-ui,Arial;color:#fff}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.pill{background:#101b24d9;border:1px solid #ffffff28;border-radius:14px;padding:9px 12px;backdrop-filter:blur(8px);box-shadow:0 5px 20px #0002}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.brand{font-weight:800;font-size:14px}.small{font-size:11px;opacity:.8}.right{display:flex;gap:7px;align-items:flex-start}.btn{pointer-events:auto;border:1px solid #ffffff3a;background:#10232be8;color:white;border-radius:12px;padding:11px 13px;font-weight:700;font-size:12px;touch-action:none}.btn:active,.btn.active{background:#3c7e5d}.help{position:absolute;left:12px;bottom:14px;max-width:220px;font-size:11px;line-height:1.45}.controls{position:absolute;inset:auto 14px 18px auto;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;pointer-events:auto}.controls button{font-size:20px;padding:0;opacity:.9}.controls .up{grid-column:2;grid-row:1}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .rightkey{grid-column:3;grid-row:2}.action{position:absolute;right:205px;bottom:28px;pointer-events:auto}.action button{min-width:86px;min-height:54px}.toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);background:#13252de8;border-radius:12px;padding:9px 14px;font-size:12px;opacity:0;transition:opacity .25s;white-space:nowrap}.toast.show{opacity:1}#map{position:absolute;right:12px;top:75px;width:118px;height:118px;border-radius:12px;background:#10232bcc;border:1px solid #ffffff44} @media(max-width:600px){.help{max-width:145px;bottom:12px}.controls{grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,47px);right:10px;bottom:12px}.action{right:165px;bottom:20px}.action button{min-width:76px;min-height:48px}.brand{font-size:12px}.pill{padding:8px 10px}#map{width:90px;height:90px;top:68px}}
</style></head><body><div id="game"></div><div id="hud">
<div class="top"><div class="pill"><div class="brand">OMASSERY OPEN WORLD</div><div class="small">Prototype 0.1 · Kerala, India</div></div><div class="right"><div class="pill"><div id="mode">ON FOOT</div><div class="small" id="speed">Explore the town</div></div><button class="btn" id="reset">↻ Reset</button></div></div>
<canvas id="map" width="180" height="180"></canvas><div class="toast" id="toast">Welcome to Omassery!</div>
<div class="pill help"><b>Controls</b><br>PC: WASD / arrows · E enter/exit car<br>Phone/tablet: use arrows · ACTION to enter/exit<br><span style="color:#b9e7c9">Map is a starter layout, not yet an exact road survey.</span></div>
<div class="controls"><button class="btn up" data-key="forward">▲</button><button class="btn left" data-key="left">◀</button><button class="btn down" data-key="back">▼</button><button class="btn rightkey" data-key="right">▶</button></div><div class="action"><button class="btn" id="action">🚗 ACTION</button></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9bc8d8); scene.fog=new THREE.Fog(0x9bc8d8,100,310);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,700); const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'}); renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=false;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf7ff,0x56724b,2));const sun=new THREE.DirectionalLight(0xfff0cf,2.0);sun.position.set(-60,100,40);scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});const grass=mat(0x7eae67),road=mat(0x454c50),line=mat(0xe7dfb2),concrete=mat(0xb8b8a7),leaf=mat(0x26784a),trunk=mat(0x795538),wallMats=[mat(0xe6d1a6),mat(0xd8b7a0),mat(0xb8d0c3),mat(0xe5e2d4),mat(0xd6c88b)],roofMats=[mat(0x8a4b3d),mat(0x626b72),mat(0x9c7652)],dark=mat(0x202b32),glass=mat(0x8ec4d3),white=mat(0xf4f4e8),skin=mat(0xb8794e),shirt=mat(0x2b6e58),blue=mat(0x2675b8),tire=mat(0x202124),rim=mat(0xaeb9bd);
function box(w,h,d,material,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);parent.add(m);return m}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;scene.add(ground);
// Starter road network: connected town streets; replace these coordinates with traced OSM road data in the next step.
const roads=[{x:0,z:0,w:12,d:330},{x:-72,z:10,w:9,d:250},{x:75,z:-10,w:9,d:240},{x:0,z:-75,w:260,d:10},{x:0,z:5,w:280,d:10},{x:0,z:85,w:250,d:10},{x:-35,z:0,w:8,d:110},{x:38,z:0,w:8,d:100}];
for(const r of roads){box(r.w,.08,r.d,road,r.x,.01,r.z);if(r.w>r.d){for(let x=r.x-r.w/2+4;x<r.x+r.w/2-2;x+=7)box(.25,.025,.14,line,x,.07,r.z)}else{for(let z=r.z-r.d/2+4;z<r.z+r.d/2-2;z+=7)box(.14,.025,.25,line,r.x,.07,z)}}
// Small sidewalks along main streets
for(const z of [-7,7])box(1,.13,320,concrete,z,.06,0);for(const x of [-7,7])box(260,.13,1,concrete,x,.06,5);
// Shops and homes around the roads
let seed=42;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const buildingSpots=[];for(let z=-145;z<=145;z+=18){for(let x=-125;x<=125;x+=19){if(Math.abs(x)<14||Math.abs(x+72)<12||Math.abs(x-75)<12||Math.abs(z-5)<13||Math.abs(z+75)<12||Math.abs(z-85)<12)continue;if(rand()<.77)buildingSpots.push([x+(rand()-.5)*5,z+(rand()-.5)*5])}}
for(let i=0;i<buildingSpots.length;i++){const [x,z]=buildingSpots[i],w=7+rand()*6,d=7+rand()*6,h=3.3+rand()*5;box(w,h,d,wallMats[i%wallMats.length],x,h/2,z);const roof=box(w+0.5,.55,d+0.5,roofMats[i%roofMats.length],x,h+.25,z);roof.rotation.y=(rand()-.5)*.12;box(1.1,1.6,.12,glass,x-w*.18,1.35,z+d/2+.07);box(1.2,1.05,.12,glass,x+w*.22,1.45,z+d/2+.07);box(1.2,2.2,.16,dark,x,1.1,z-d/2-.08)}
// Landmark-style small town shop sign and bus stop
box(13,4,8,wallMats[0],18,2,16);box(13.3,.7,8.3,roofMats[0],18,4.35,16);box(8,.75,.25,blue,18,3.25,20.1);box(7,.15,.25,white,18,3.25,20.25);box(3,2,.18,dark,-14,1,-5);box(3.4,.15,.25,white,-14,2.1,-5);
function palm(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const t=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.28*s,5*s,5),trunk);t.position.y=2.5*s;g.add(t);for(let i=0;i<7;i++){const a=i*Math.PI*2/7;const f=new THREE.Mesh(new THREE.ConeGeometry(.28*s,3.2*s,4),leaf);f.position.set(Math.cos(a)*1.05*s,5*s+Math.sin(i*1.7)*.25,Math.sin(a)*1.05*s);f.rotation.z=Math.cos(a)*.8;f.rotation.x=Math.sin(a)*.8;g.add(f)}return g}
for(let i=0;i<145;i++){let x=(rand()-.5)*290,z=(rand()-.5)*290;if(roads.some(r=>Math.abs(x-r.x)<r.w/2+3&&Math.abs(z-r.z)<r.d/2+3))continue;palm(x,z,.7+rand()*.7)}
// Player character (simple lightweight model)
const player=new THREE.Group();scene.add(player);const torso=box(.8,1.1,.45,shirt,0,1.35,0,player);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),skin);head.position.y=2.1;player.add(head);box(.22,.65,.24,blue,-.23,.48,0,player);box(.22,.65,.24,blue,.23,.48,0,player);box(.18,.7,.2,skin,-.52,1.35,0,player);box(.18,.7,.2,skin,.52,1.35,0,player);player.position.set(0,0,18);
// Drivable car model
const car=new THREE.Group();scene.add(car);box(2.15,.65,4,blue,0,.75,0,car);box(1.55,.72,1.9,glass,0,1.38,-.15,car);box(2.18,.18,1.0,blue,0,1.05,-1.35,car);const wheels=[];for(const x of [-1.08,1.08])for(const z of [-1.25,1.25]){const wh=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,10),tire);wh.rotation.z=Math.PI/2;wh.position.set(x,.42,z);car.add(wh);wheels.push(wh)}car.position.set(4,0,19);
let inCar=false,carSpeed=0,heading=0;const keys={};let touch={};const mode=document.querySelector('#mode'),speedEl=document.querySelector('#speed'),toast=document.querySelector('#toast');let toastTimer;function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
function action(){if(!inCar){if(player.position.distanceTo(car.position)<5){inCar=true;say('You got into the car!');mode.textContent='DRIVING';}else say('Walk closer to the blue car to enter.')}else{inCar=false;player.position.set(car.position.x+2,0,car.position.z+1);player.rotation.y=heading;say('You are on foot.');mode.textContent='ON FOOT';}}
document.querySelector('#action').addEventListener('click',action);document.querySelector('#reset').addEventListener('click',()=>{inCar=false;carSpeed=0;heading=0;car.position.set(4,0,19);player.position.set(0,0,18);mode.textContent='ON FOOT';say('Game reset.')});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'&&!e.repeat)action()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();touch[k]=true;b.classList.add('active')},off=e=>{e.preventDefault();touch[k]=false;b.classList.remove('active')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,off))});
function down(k){return !!(keys[k]||touch[k]||((k==='forward')&&(keys['w']||keys['arrowup']))||((k==='back')&&(keys['s']||keys['arrowdown']))||((k==='left')&&(keys['a']||keys['arrowleft']))||((k==='right')&&(keys['d']||keys['arrowright'])))}
const clock=new THREE.Clock();const camTarget=new THREE.Vector3();function updateMap(){const c=document.querySelector('#map'),ctx=c.getContext('2d');ctx.clearRect(0,0,180,180);ctx.fillStyle='#719c62';ctx.fillRect(0,0,180,180);ctx.strokeStyle='#555e61';ctx.lineWidth=5;for(const r of roads){ctx.beginPath();ctx.moveTo(90+(r.x-r.w/2)*.48,90+(r.z-r.d/2)*.48);ctx.lineTo(90+(r.x+r.w/2)*.48,90+(r.z+r.d/2)*.48);ctx.stroke()}const p=inCar?car.position:player.position;ctx.fillStyle='#f4d35e';ctx.beginPath();ctx.arc(90+p.x*.48,90+p.z*.48,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='9px system-ui';ctx.fillText('OMASSERY',8,14)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(inCar){if(down('forward'))carSpeed=Math.min(carSpeed+14*dt,20);else if(down('back'))carSpeed=Math.max(carSpeed-18*dt,-7);else carSpeed*=Math.pow(.93,dt*60);if(down('left'))heading+=1.65*dt*(carSpeed>=0?1:-1);if(down('right'))heading-=1.65*dt*(carSpeed>=0?1:-1);car.rotation.y=heading;car.position.x+=Math.sin(heading)*carSpeed*dt;car.position.z+=Math.cos(heading)*carSpeed*dt;for(const w of wheels)w.rotation.x+=carSpeed*dt*1.8;player.position.copy(car.position);speedEl.textContent=Math.round(Math.abs(carSpeed)*4)+' km/h';}else{const f=(down('forward')?1:0)-(down('back')?1:0),s=(down('right')?1:0)-(down('left')?1:0);if(f||s){heading=Math.atan2(s,f)+Math.PI/2;const dx=(Math.sin(heading)*f+Math.cos(heading)*s)*8*dt,dz=(Math.cos(heading)*f-Math.sin(heading)*s)*8*dt;player.position.x+=dx;player.position.z+=dz;player.rotation.y=Math.atan2(dx,dz)}speedEl.textContent='Explore the town';}
// Keep the playable area bounded
const obj=inCar?car:player;obj.position.x=THREE.MathUtils.clamp(obj.position.x,-155,155);obj.position.z=THREE.MathUtils.clamp(obj.position.z,-170,170);
const focus=inCar?car:player;const behind=new THREE.Vector3(Math.sin(focus.rotation.y)*-10,6.2,Math.cos(focus.rotation.y)*-10);if(!inCar){behind.set(0,5.5,-9)}const desired=focus.position.clone().add(behind);camera.position.lerp(desired,1-Math.pow(.001,dt));camTarget.copy(focus.position);camTarget.y+=1.1;camera.lookAt(camTarget);updateMap();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});say('Welcome! Walk to the blue car and press ACTION.');
</script></body></html>
